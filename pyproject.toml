[project]
name = "ai-devops-copilot"
version = "0.1.0"
description = "Local, privacy-first AI DevOps incident analysis and root cause identification platform"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.139.2",
    "google-genai>=2.14.0",
    "ollama>=0.6.2",
    "openai>=2.47.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]